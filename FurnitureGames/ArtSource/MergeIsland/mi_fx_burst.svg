<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- FX: radial light rays (rotate slowly behind reveals). White, tintable. 12 rays that fade
       outward: a dashed circle whose stroke spans from the centre to r=120. -->
  <defs>
    <radialGradient id="g" cx="128" cy="128" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="60" fill="none" stroke="url(#g)" stroke-width="120"
          stroke-dasharray="15.708 15.708"/>
</svg>
