    <path d="M132 76 L150 58 L168 76 M150 58 V38" fill="none" stroke="#4a2b17" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 76 L150 58 L168 76 M150 58 V38" fill="none" stroke="#fff4cf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
